name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Lint
        run: bash scripts/lint

      # scripts/lint auto-fixes. Fail if the pull request was not already clean.
      - name: Verify lint made no changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::Lint changed files. Run bash scripts/lint and commit the result."
            exit 1
          fi

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: ./scripts/install

      - name: Typecheck
        run: ./scripts/typecheck

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Format
        run: ./scripts/format

      # scripts/format rewrites files. Fail if the pull request was not already clean.
      - name: Verify format made no changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::Format changed files. Run ./scripts/format and commit the result."
            exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [lint, typecheck, format]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install limactl
        run: |
          VERSION=$(curl -fsSL https://api.github.com/repos/lima-vm/lima/releases/latest | jq -r .tag_name)
          curl -fsSL "https://github.com/lima-vm/lima/releases/download/${VERSION}/lima-${VERSION:1}-$(uname -s)-$(uname -m).tar.gz" | sudo tar Cxzvm /usr/local

          # For Lima v1.1 onward
          curl -fsSL "https://github.com/lima-vm/lima/releases/download/${VERSION}/lima-additional-guestagents-${VERSION:1}-$(uname -s)-$(uname -m).tar.gz" | sudo tar Cxzvm /usr/local

          limactl --version

      - name: Install
        run: ./scripts/install

      - name: Test
        run: ./scripts/test
