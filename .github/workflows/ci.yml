name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Lint
        run: bash scripts/lint

      # scripts/lint auto-fixes. Fail if the pull request was not already clean.
      - name: Verify lint made no changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::Lint changed files. Run bash scripts/lint and commit the result."
            exit 1
          fi

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: ./scripts/install

      - name: Typecheck
        run: ./scripts/typecheck

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Format
        run: ./scripts/format

      # scripts/format rewrites files. Fail if the pull request was not already clean.
      - name: Verify format made no changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::Format changed files. Run ./scripts/format and commit the result."
            exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [lint, typecheck, format]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Lima
        id: lima-actions-setup
        uses: lima-vm/lima-actions/setup@v1

      - name: Cache Lima images
        uses: actions/cache@v4
        with:
          path: ~/.cache/lima
          key: lima-${{ steps.lima-actions-setup.outputs.version }}

      - name: Install
        run: ./scripts/install

      - name: Unit Test
        run: ./scripts/test

      - name: E2E Test
        run: ./scripts/test opencode
